catalog: ATMOSYNC_DB
schema: raw
sql: "SELECT\r\n    SHIPMENT_ID,\r\n    CARGO_TYPE,\r\n    TEMPERATURE_CELSIUS,\r\n\
  \    HUMIDITY_PERCENTAGE,\r\n    SPOILAGE_RISK_PERCENT,\r\n    REMAINING_SHELF_LIFE_DAYS,\r\
  \n    RISK_CATEGORY,\r\n    SHELF_LIFE_CATEGORY,\r\n    SPOILAGE_STATUS,\r\n   \
  \ CASE\r\n        WHEN RISK_CATEGORY = 'Critical'\r\n             AND SPOILAGE_RISK_PERCENT\
  \ >= 80\r\n            THEN 'Urgent Reroute'\r\n        WHEN SHELF_LIFE_CATEGORY\
  \ IN ('Critical', 'At Risk')\r\n             OR SPOILAGE_RISK_PERCENT >= 60\r\n\
  \            THEN 'Reroute'\r\n        ELSE 'Monitor'\r\n    END AS RECOMMENDED_ACTION\r\
  \nFROM RAW.INT_SPOILAGE_ANALYSIS;"
